<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ADSMOD: Automated Adsorption Model Fitting - Accelerate adsorption-model research with automated curve fitting and visual analytics" />
    <script>
      // Resolve the theme before first paint to avoid a light flash; ThemeService takes over after bootstrap.
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('adsmod-theme'); } catch (e) {}
        var dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>ADSMOD Adsorption Modeling</title>
  </head>
  <body>
    <adsmod-root></adsmod-root>
  </body>
</html>
