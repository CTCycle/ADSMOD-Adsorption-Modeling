[project]
name = "adsmod-common"
version = "3.0.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.13.4"
]

[tool.hatch.build.targets.wheel]
packages = ["src/adsmod_common"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ['src']
cache_dir = "../../tests/cache/pytest"
