[project]
name = "adsmod-core-service"
version = "3.0.0"
requires-python = ">=3.14"
dependencies = [
    "adsmod-shared",
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pydantic==2.13.4"
]

[tool.uv.sources]
adsmod-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["core_service"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
