[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adsmod-backend-workspace"
version = "3.0.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.13.4",
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "alembic==1.19.1",
    "SQLAlchemy==2.0.52",
    "psycopg[binary]==3.3.4",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scipy==1.16.3",
]

[project.optional-dependencies]
ml = [
    "torch==2.10.0+cu130",
    "keras==3.13.1",
    "scikit-learn==1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-playwright>=0.5.0",
    "psutil>=6.1.1",
    "ruff==0.15.9",
]

[tool.hatch.build]
# Editable installs need the parent of this project directory so `server`
# resolves to the source package during local development.
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
packages = ["."]
sources = {"" = "server"}
exclude = ["core/**"]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]
path_separator = "os"

[tool.pytest.ini_options]
cache_dir = "../tests/cache/pytest"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.ruff]
cache-dir = "../tests/cache/ruff"

[tool.ruff.lint]
extend-select = ["C901", "PLR0912", "PLR0915"]
