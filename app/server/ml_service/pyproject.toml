[project]
name = "adsmod-ml-service"
version = "3.0.0"
requires-python = ">=3.14"
dependencies = [
    "adsmod-shared",
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "torch==2.10.0+cu130",
    "keras==3.13.1",
    "scikit-learn==1.8.0",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pydantic==2.13.4"
]

[tool.uv.sources]
adsmod-shared = { workspace = true }
torch = { index = "pytorch-cu130" }

[tool.hatch.build.targets.wheel]
packages = ["ml_service"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
