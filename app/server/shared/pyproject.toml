[project]
name = "adsmod-shared"
version = "3.0.0"
requires-python = ">=3.14"
dependencies = [
    "adsmod-common",
    "SQLAlchemy==2.0.52",
    "psycopg[binary]==3.3.4",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pydantic==2.13.4",
    "PubChemPy==1.0.5"
]

[tool.uv.sources]
adsmod-common = { path = "../../backend/common" }

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
