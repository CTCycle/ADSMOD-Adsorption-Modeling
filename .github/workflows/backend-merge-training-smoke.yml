name: Backend Merge Training Smoke

on:
  push:
    branches:
      - backend-merge

permissions:
  contents: write

jobs:
  cpu-training-live:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          python-version: "3.14.2"
      - name: Replace SCADS Atomic Lambda feature slicing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/backend/ml/src/adsmod_ml/learning/models/qmodel.py')
          text = path.read_text(encoding='utf-8')
          old = '''        adsorbent_index = layers.Lambda(
              lambda x: keras.ops.cast(x[:, 2], "int32"),
              output_shape=(),
              name="adsorbent_index",
          )(self.features_input)
          chemometric_feature = layers.Lambda(
              lambda x: x[:, 1],
              output_shape=(),
              name="chemometric_feature",
          )(self.features_input)
          molecular_embeddings = self.molecular_embeddings(
              self.adsorbates_input, adsorbent_index, chemometric_feature
          )
          context_vector = self.context_pooling(molecular_embeddings)

          temperature_feature = layers.Lambda(
              lambda x: keras.ops.expand_dims(x[:, 0], axis=-1),
              output_shape=(1,),
              name="temperature_feature",
          )(self.features_input)
          molecular_weight_feature = layers.Lambda(
              lambda x: keras.ops.expand_dims(x[:, 1], axis=-1),
              output_shape=(1,),
              name="molecular_weight_feature",
          )(self.features_input)
          pressure_feature = layers.Lambda(
              lambda x: keras.ops.expand_dims(x[:, 3], axis=-1),
              output_shape=(1,),
              name="pressure_feature",
          )(self.features_input)
'''
          new = '''        adsorbent_index = keras.ops.cast(self.features_input[:, 2], "int32")
          chemometric_feature = self.features_input[:, 1]
          molecular_embeddings = self.molecular_embeddings(
              self.adsorbates_input, adsorbent_index, chemometric_feature
          )
          context_vector = self.context_pooling(molecular_embeddings)

          temperature_feature = keras.ops.expand_dims(self.features_input[:, 0], axis=-1)
          molecular_weight_feature = keras.ops.expand_dims(self.features_input[:, 1], axis=-1)
          pressure_feature = keras.ops.expand_dims(self.features_input[:, 3], axis=-1)
'''
          if old not in text:
              raise SystemExit('expected SCADS Atomic Lambda feature block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install ML-enabled backend
        run: uv sync --locked --project app/backend --extra ml --group dev
      - name: Validate training fixes
        run: |
          uv run --project app/backend --extra ml --group dev ruff check --isolated app/backend/ml/src/adsmod_ml/learning/serialization app/backend/ml/src/adsmod_ml/learning/models/qmodel.py app/backend/ml/src/adsmod_ml/learning/training/manager.py app/backend/ml/tests/test_resume_validation.py app/tests/unit/test_serializer.py
          uv run --project app/backend --extra ml --group dev python -m pytest app/backend/ml/tests/test_resume_validation.py app/tests/unit/test_serializer.py -q --tb=short
          git diff --check
      - name: Seed isolated processed dataset
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('app/resources/adsmod.json').read_text(encoding='utf-8'))
          payload['storage']['root'] = os.path.join(os.environ['RUNNER_TEMP'], 'adsmod-training-live')
          Path(os.environ['RUNNER_TEMP'], 'adsmod-training-live.json').write_text(json.dumps(payload), encoding='utf-8')
          PY
          app/backend/.venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          from adsmod_common.config import AdsmodConfig
          from adsmod_core.services.training_data import open_training_data_service
          from adsmod_ml.contracts.training import TrainingMetadata
          from adsmod_ml.learning.serialization.training import TrainingDataSerializer

          config_path = Path(os.environ['RUNNER_TEMP'], 'adsmod-training-live.json')
          payload = json.loads(config_path.read_text(encoding='utf-8'))
          config = AdsmodConfig.model_validate(payload)
          storage_root = Path(payload['storage']['root'])
          access = open_training_data_service(config)
          serializer = TrainingDataSerializer(access, storage_root / 'training')
          label = 'live-smoke'
          metadata = TrainingMetadata(
              created_at='2026-09-02T00:00:00+00:00',
              sample_size=1.0,
              validation_size=0.25,
              min_measurements=1,
              max_measurements=30,
              smile_sequence_size=20,
              max_pressure=10000.0,
              max_uptake=20.0,
              total_samples=4,
              train_samples=3,
              validation_samples=1,
              smile_vocabulary={'C': 1},
              adsorbent_vocabulary={'carbon': 0},
              normalization_stats={
                  'temperature': 300.0,
                  'adsorbate_molecular_weight': 16.0,
                  'pressure': 100000.0,
                  'adsorbed_amount': 1.0,
              },
              smile_vocabulary_size=2,
              adsorbent_vocabulary_size=1,
          )
          dataset_hash = TrainingDataSerializer.compute_metadata_hash(metadata)
          metadata.dataset_hash = dataset_hash
          def row(split, offset):
              pressure = [0.10 + offset, 0.20 + offset, 0.30 + offset] + [0.0] * 27
              uptake = [0.05 + offset, 0.10 + offset, 0.15 + offset] + [0.0] * 27
              return {
                  'dataset_label': label,
                  'dataset_name': label,
                  'split': split,
                  'temperature': 0.95,
                  'pressure': pressure,
                  'adsorbed_amount': uptake,
                  'encoded_adsorbent': 0,
                  'adsorbate_molecular_weight': 1.0,
                  'adsorbate_encoded_SMILE': [1] + [0] * 19,
              }
          frame = pd.DataFrame([
              row('train', 0.00),
              row('train', 0.01),
              row('train', 0.02),
              row('validation', 0.015),
          ])
          serializer.save_training_dataset(frame, label, dataset_hash)
          metadata_row = metadata.model_dump(mode='json')
          metadata_row['dataset_label'] = label
          serializer.save_training_metadata(pd.DataFrame([metadata_row]), label)
          info = serializer.get_training_dataset_info(label)
          assert info is not None and info['train_samples'] == 3 and info['validation_samples'] == 1, info
          access.close()
          PY
      - name: Run one real CPU training epoch and resume
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_LOG="$RUNNER_TEMP/training-backend.log"
          setsid app/backend/.venv/bin/python -m adsmod_core.cli --config "$RUNNER_TEMP/adsmod-training-live.json" >"$BACKEND_LOG" 2>&1 &
          BACKEND_PID=$!
          cleanup() {
            kill -- -"$BACKEND_PID" 2>/dev/null || true
            wait "$BACKEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:6045/health/ready >/dev/null; then break; fi
            sleep 1
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then cat "$BACKEND_LOG"; exit 1; fi
          done
          app/backend/.venv/bin/python - <<'PY'
          import json, time, urllib.request

          BASE = 'http://127.0.0.1:6045/api/v1/training'
          def get(path):
              with urllib.request.urlopen(BASE + path, timeout=15) as response:
                  return json.load(response)
          def post(path, payload=None):
              data = json.dumps(payload or {}).encode('utf-8')
              request = urllib.request.Request(BASE + path, data=data, headers={'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          def wait_done(limit=180):
              deadline = time.time() + limit
              last = None
              while time.time() < deadline:
                  last = get('/status')
                  if not last['is_training']:
                      return last
                  time.sleep(1)
              raise AssertionError(f'training did not finish: {last}')

          datasets = get('/processed-datasets')
          assert datasets['datasets'][0]['dataset_label'] == 'live-smoke', datasets
          start = post('/start', {
              'dataset_label': 'live-smoke',
              'selected_model': 'SCADS Atomic',
              'epochs': 1,
              'batch_size': 2,
              'molecular_embedding_size': 64,
              'num_attention_heads': 1,
              'num_encoders': 1,
              'dropout_rate': 0.0,
              'dataloader_workers': 0,
              'pin_memory': False,
              'use_device_GPU': False,
              'use_mixed_precision': False,
              'use_jit': False,
              'use_lr_scheduler': False,
              'save_checkpoints': True,
              'checkpoints_frequency': 1,
              'custom_name': 'live_smoke',
          })
          assert start['status'] == 'started', start
          finished = wait_done()
          assert finished['current_epoch'] >= 1, finished
          assert finished['history'], finished
          checkpoints = get('/checkpoints')['checkpoints']
          assert checkpoints, checkpoints
          checkpoint = checkpoints[0]['name']
          details = get('/checkpoints/' + checkpoint)
          assert details['metadata']['dataset_hash'], details
          resumed = post('/resume', {'checkpoint_name': checkpoint, 'additional_epochs': 1})
          assert resumed['status'] == 'started', resumed
          finished_resume = wait_done()
          assert finished_resume['current_epoch'] >= 2, finished_resume
          assert len(finished_resume['history']) >= 2, finished_resume
          PY
          cleanup
          trap - EXIT
          sleep 2
          if kill -0 "$BACKEND_PID" 2>/dev/null; then
            echo 'Training backend survived shutdown.' >&2
            exit 1
          fi
          if curl -fsS --max-time 2 http://127.0.0.1:6045/health/ready >/dev/null 2>&1; then
            echo 'Training backend still responds after shutdown.' >&2
            exit 1
          fi
      - name: Commit validated serialization fix
        run: |
          git add app/backend/ml/src/adsmod_ml/learning/models/qmodel.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make SCADS Atomic feature extraction serializable"
          git push origin HEAD:backend-merge
