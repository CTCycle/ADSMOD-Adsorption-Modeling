name: Public Data Branch Validation

on:
  push:
    branches: [public-data-expansion]

permissions:
  contents: write

concurrency:
  group: public-data-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          python-version: "3.14.2"
      - name: Refresh lockfile for dependency changes
        run: uv lock --project app/server
      - name: Validate base backend remains ML-optional
        run: |
          uv sync --locked --project app/server --no-dev
          uv run --project app/server --no-dev python - <<'PY'
          import importlib.util, json, tempfile
          from pathlib import Path
          from fastapi.testclient import TestClient
          from adsmod_common.config import AdsmodConfig
          from adsmod_core.app import create_app
          assert importlib.util.find_spec('adsmod_ml') is None
          payload = json.loads(Path('app/resources/adsmod.json').read_text())
          with tempfile.TemporaryDirectory() as tmp:
              payload['storage']['root'] = tmp
              with TestClient(create_app(AdsmodConfig.model_validate(payload))) as client:
                  assert client.get('/api/v1/system/capabilities').json()['features']['machine_learning'] is False
                  assert client.get('/api/v1/public-data/sources?check_health=false').status_code == 200
                  assert client.get('/health/ready').json()['state'] == 'ready'
          PY
      - name: Install full development environment
        run: uv sync --locked --project app/server --extra ml --group dev
      - name: Ruff
        run: uv run --project app/server --extra ml --group dev ruff check --isolated app/server app/tests app/scripts
      - name: Backend tests and migrations
        run: uv run --project app/server --extra ml --group dev python -m pytest -c app/tests/pytest.ini app/server/common/tests app/server/core/tests app/server/ml/tests app/tests/backend app/tests/persistence app/tests/unit -q --tb=short
      - name: Generate canonical artifacts
        run: |
          uv run --project app/server --extra ml --group dev python app/scripts/generate_openapi.py --config app/resources/adsmod.json --output app/server/openapi/backend.json
          uv run --project app/server --extra ml --group dev python app/scripts/generate_config_schema.py --output app/resources/adsmod.schema.json
      - name: External provider smoke evidence
        run: |
          uv run --project app/server --extra ml --group dev python - <<'PY'
          import asyncio, json
          from pathlib import Path
          from adsmod_common.config import load_config
          from adsmod_core.services.container import CoreServiceContainer

          async def main():
              config = load_config(Path('app/resources/adsmod.json'))
              container = CoreServiceContainer(config)
              try:
                  results = {}
                  for key, provider in container.public_data_service.providers.items():
                      health = await provider.health()
                      results[key] = {'status': health.status, 'detail': health.detail}
                      assert health.status == 'available', f'{key} provider unavailable: {health.detail}'

                  pubchem = container.public_data_service.providers['pubchem']
                  compound = await pubchem.resolve('methane')
                  results['pubchem_resolve'] = {
                      'cid': compound['cid'],
                      'inchi_key': compound['inchi_key'],
                  }
                  assert compound['cid'] == '297'
                  assert compound['inchi_key'] == 'VNWKTOKETHGBQD-UHFFFAOYSA-N'

                  cod = container.public_data_service.providers['cod']
                  records = await cod.search(cod_id='4502440')
                  assert records, 'COD lookup returned no record for known entry 4502440'
                  metadata, cif_text = await cod.fetch_record('4502440')
                  atoms = cod.parse_atoms(cif_text)
                  results['cod_lookup'] = {
                      'matches': len(records),
                      'cod_id': metadata['cod_id'],
                      'cif_bytes': len(cif_text.encode('utf-8')),
                      'normalized_atoms': len(atoms),
                  }
                  assert metadata['cod_id'] == '4502440'
                  assert cif_text.strip()
                  assert atoms, 'COD entry 4502440 did not produce normalized atom coordinates'

                  print(json.dumps(results, indent=2, default=str))
              finally:
                  container.database.dispose()

          asyncio.run(main())
          PY
      - name: Collect generated artifacts
        run: |
          mkdir -p validation-artifacts/app/server/openapi validation-artifacts/app/resources validation-artifacts/app/server
          cp app/server/uv.lock validation-artifacts/app/server/uv.lock
          cp app/server/openapi/backend.json validation-artifacts/app/server/openapi/backend.json
          cp app/resources/adsmod.schema.json validation-artifacts/app/resources/adsmod.schema.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-data-generated-artifacts
          path: validation-artifacts

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: app/client/package-lock.json
      - working-directory: app/client
        run: npm ci --no-audit --no-fund
      - working-directory: app/client
        run: npm run lint
      - working-directory: app/client
        run: npm run test:unit --if-present
      - working-directory: app/client
        run: npm run build
      - name: Install Edge for browser layout validation
        working-directory: app/client
        run: npx playwright install --with-deps msedge
      - name: Correct detail-route precedence in deterministic browser fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/client/tests/visual/public-data-layout.spec.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "await page.route('**/api/v1/public-data/adsorption**', async (route) => {",
              "await page.route(/\\/api\\/v1\\/public-data\\/adsorption(?:\\?.*)?$/, async (route) => {",
          )
          text = text.replace(
              "await page.route('**/api/v1/public-data/chemicals**', async (route) => {",
              "await page.route(/\\/api\\/v1\\/public-data\\/chemicals(?:\\?.*)?$/, async (route) => {",
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate Public Data layouts at configured viewport sizes
        working-directory: app/client
        run: npx playwright test -c playwright.config.ts tests/visual/public-data-layout.spec.ts

  sync-generated:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-data-expansion
      - uses: actions/download-artifact@v4
        with:
          name: public-data-generated-artifacts
          path: generated
      - name: Sync generated artifacts and validated browser fixture
        run: |
          cp generated/app/server/uv.lock app/server/uv.lock
          cp generated/app/server/openapi/backend.json app/server/openapi/backend.json
          cp generated/app/resources/adsmod.schema.json app/resources/adsmod.schema.json
          python - <<'PY'
          from pathlib import Path
          path = Path('app/client/tests/visual/public-data-layout.spec.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "await page.route('**/api/v1/public-data/adsorption**', async (route) => {",
              "await page.route(/\\/api\\/v1\\/public-data\\/adsorption(?:\\?.*)?$/, async (route) => {",
          )
          text = text.replace(
              "await page.route('**/api/v1/public-data/chemicals**', async (route) => {",
              "await page.route(/\\/api\\/v1\\/public-data\\/chemicals(?:\\?.*)?$/, async (route) => {",
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit synchronized generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/server/uv.lock app/server/openapi/backend.json app/resources/adsmod.schema.json app/client/tests/visual/public-data-layout.spec.ts
          if git diff --cached --quiet; then
            echo "Generated artifacts are already synchronized."
          else
            git commit -m "chore: synchronize public data generated artifacts"
            git push origin HEAD:public-data-expansion
          fi
