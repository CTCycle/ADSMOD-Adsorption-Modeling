name: Backend Merge Apply

on:
  push:
    branches: [backend-merge]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.30
          python-version: 3.14.2
      - name: Repair bootstrap schema generation command
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/backend_merge_transform.py')
          text = path.read_text(encoding='utf-8')
          old = 'subprocess.run(["uv", "run", "--project", "app/backend", "--group", "dev", "python", "app/scripts/generate_config_schema.py"], check=True)'
          new = 'subprocess.run(["uv", "run", "--project", "app/backend", "--group", "dev", "python", "app/scripts/generate_config_schema.py", "--output", "app/resources/adsmod.schema.json"], check=True)'
          if old not in text:
              raise SystemExit('expected schema generation command was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Apply backend merge refactor
        run: python .github/backend_merge_transform.py
      - name: Migrate unified-backend validation contracts
        shell: python
        run: |
          from pathlib import Path

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content.strip() + "\n", encoding="utf-8")

          write("app/tests/conftest.py", r'''
          """Pytest configuration and shared fixtures for ADSMOD E2E tests."""
          from __future__ import annotations

          import json
          from pathlib import Path

          import pytest
          from playwright.sync_api import APIRequestContext, Page, Playwright

          TESTS_DIR = Path(__file__).resolve().parent
          FIXTURES_DIR = TESTS_DIR / "fixtures"
          APP_ROOT = TESTS_DIR.parent
          WILDCARD_BIND_HOSTS = {"", "0.0.0.0", "::", "[::]"}
          CANONICAL_CONFIG = APP_ROOT / "resources" / "adsmod.json"


          def normalize_client_host(bind_host: str) -> str:
              stripped = bind_host.strip()
              return "127.0.0.1" if stripped in WILDCARD_BIND_HOSTS else stripped


          def resolve_test_urls() -> tuple[str, str]:
              runtime = json.loads(CANONICAL_CONFIG.read_text(encoding="utf-8"))["runtime"]
              host = normalize_client_host(runtime["host"])
              return (
                  f"http://{host}:{runtime['frontend_port']}".rstrip("/"),
                  f"http://{host}:{runtime['backend_port']}".rstrip("/"),
              )


          FRONTEND_URL, BACKEND_URL = resolve_test_urls()


          @pytest.fixture(scope="session")
          def base_url() -> str:
              return FRONTEND_URL


          @pytest.fixture(scope="session")
          def api_base_url() -> str:
              return BACKEND_URL


          @pytest.fixture(scope="session")
          def api_context(playwright: Playwright, api_base_url: str) -> APIRequestContext:
              context = playwright.request.new_context(base_url=api_base_url)
              yield context
              context.dispose()


          @pytest.fixture(scope="session")
          def ml_api_base_url(api_base_url: str) -> str:
              """Compatibility fixture for ML-focused tests, using the one canonical backend."""
              return api_base_url


          @pytest.fixture(scope="session")
          def ml_api_context(playwright: Playwright, api_base_url: str) -> APIRequestContext:
              context = playwright.request.new_context(base_url=api_base_url)
              capabilities = context.get("/api/v1/system/capabilities")
              if not capabilities.ok or not capabilities.json().get("features", {}).get("machine_learning"):
                  context.dispose()
                  pytest.skip("Optional machine learning dependencies are not installed.")
              yield context
              context.dispose()


          @pytest.fixture
          def page_context(page: Page, base_url: str) -> Page:
              page.goto(base_url)
              return page


          @pytest.fixture(scope="session")
          def sample_csv_path() -> Path:
              return FIXTURES_DIR / "sample_adsorption.csv"
          ''')

          write("app/tests/backend/test_backend_dependency_boundaries.py", r'''
          from __future__ import annotations

          import re
          from pathlib import Path

          BACKEND_ROOT = Path("app/backend")
          GENERATED_DIRS = {".venv", "__pycache__", ".pytest_cache", ".uv-cache"}


          def _iter_python_files(root: Path):
              for path in root.rglob("*.py"):
                  if not any(part in GENERATED_DIRS for part in path.parts):
                      yield path


          def _has_import(text: str, package: str) -> bool:
              return bool(re.search(rf"^(?:from|import) {re.escape(package)}(?:\.|\s|$)", text, re.MULTILINE))


          def test_common_has_no_framework_or_persistence_imports() -> None:
              for path in _iter_python_files(BACKEND_ROOT / "common"):
                  text = path.read_text(encoding="utf-8")
                  hits = [pkg for pkg in ("fastapi", "sqlalchemy") if _has_import(text, pkg)]
                  assert not hits, f"{path}: forbidden imports {hits}"


          def test_core_does_not_statically_import_heavy_ml_packages() -> None:
              for path in _iter_python_files(BACKEND_ROOT / "core"):
                  text = path.read_text(encoding="utf-8")
                  hits = [pkg for pkg in ("torch", "keras", "sklearn") if _has_import(text, pkg)]
                  assert not hits, f"{path}: forbidden imports {hits}"


          def test_ml_extension_does_not_own_persistence_layer() -> None:
              for path in _iter_python_files(BACKEND_ROOT / "ml"):
                  text = path.read_text(encoding="utf-8")
                  hits = [pkg for pkg in ("sqlalchemy", "alembic") if _has_import(text, pkg)]
                  assert not hits, f"{path}: forbidden imports {hits}"


          def test_contract_packages_have_no_framework_or_persistence_imports() -> None:
              for package_root in (
                  BACKEND_ROOT / "common" / "src",
                  BACKEND_ROOT / "core" / "src" / "adsmod_core" / "contracts",
                  BACKEND_ROOT / "ml" / "src" / "adsmod_ml" / "contracts",
              ):
                  for path in _iter_python_files(package_root):
                      text = path.read_text(encoding="utf-8")
                      hits = [pkg for pkg in ("fastapi", "sqlalchemy") if _has_import(text, pkg)]
                      assert not hits, f"{path}: forbidden imports {hits}"
          ''')

          write("app/tests/backend/test_core_routes.py", r'''
          from __future__ import annotations

          from pathlib import Path
          from fastapi.testclient import TestClient
          from adsmod_common.config import StorageConfig, load_config
          from adsmod_core.app import create_app

          CONFIG_PATH = Path("app/resources/adsmod.json")


          def _config(tmp_path: Path):
              base = load_config(CONFIG_PATH)
              return base.model_copy(update={
                  "storage": StorageConfig(root=tmp_path),
                  "application": base.application.model_copy(update={
                      "database": base.application.database.model_copy(update={"sqlite_path": "data/test.db"})
                  }),
              })


          def test_unified_routes_expose_core_and_optional_ml_surface(tmp_path: Path) -> None:
              with TestClient(create_app(_config(tmp_path))) as client:
                  assert client.get("/health/live").json()["service"] == "backend"
                  assert client.get("/health/ready").json()["state"] == "ready"
                  capabilities = client.get("/api/v1/system/capabilities").json()
                  assert capabilities["features"]["datasets"] is True
                  assert capabilities["features"]["machine_learning"] is True
                  assert client.get("/api/v1/datasets").status_code == 200
                  assert client.get("/api/v1/training/configuration").status_code == 200
                  assert client.get("/api/health").status_code == 404


          def test_unified_openapi_surface_contains_core_and_training_routes(tmp_path: Path) -> None:
              with TestClient(create_app(_config(tmp_path))) as client:
                  paths = client.get("/openapi.json").json()["paths"]
                  assert "/api/v1/datasets" in paths
                  assert "/api/v1/fitting/models" in paths
                  assert "/api/v1/training/configuration" in paths
          ''')

          write("app/tests/backend/test_ml_routes.py", r'''
          from __future__ import annotations

          from pathlib import Path
          from fastapi.testclient import TestClient
          from adsmod_common.config import StorageConfig, load_config
          from adsmod_core.app import create_app

          CONFIG_PATH = Path("app/resources/adsmod.json")


          def _config(tmp_path: Path):
              base = load_config(CONFIG_PATH)
              return base.model_copy(update={
                  "storage": StorageConfig(root=tmp_path),
                  "application": base.application.model_copy(update={
                      "database": base.application.database.model_copy(update={"sqlite_path": "data/test.db"})
                  }),
              })


          def test_ml_routes_are_mounted_on_the_single_backend(tmp_path: Path) -> None:
              with TestClient(create_app(_config(tmp_path))) as client:
                  assert client.get("/health/live").json()["service"] == "backend"
                  assert client.get("/api/v1/training/configuration").status_code == 200
                  assert client.get("/api/v1/training/status").status_code == 200
                  assert client.get("/api/v1/system/configuration").status_code == 200


          def test_standalone_ml_server_entrypoints_are_removed() -> None:
              root = Path("app/backend/ml/src/adsmod_ml")
              assert not (root / "app.py").exists()
              assert not (root / "cli.py").exists()
              assert not (root / "http" / "entrypoint.py").exists()
              assert not (root / "clients" / "core_client.py").exists()
          ''')

          write("app/tests/backend/test_openapi_schema.py", r'''
          from __future__ import annotations

          import json
          from pathlib import Path

          OPENAPI_PATH = Path("app/backend/openapi/backend.json")


          def test_unified_openapi_snapshot_covers_complete_surface() -> None:
              schema = json.loads(OPENAPI_PATH.read_text(encoding="utf-8"))
              assert schema["openapi"] == "3.1.0"
              paths = schema["paths"]
              assert "/api/v1/datasets" in paths
              assert "/api/v1/fitting/models" in paths
              assert "/api/v1/training/datasets" in paths
              assert "/api/v1/training/configuration" in paths
          ''')

          write("app/tests/unit/test_frontend_boundaries.py", r'''
          from __future__ import annotations

          from pathlib import Path


          def test_training_routes_are_capability_guarded() -> None:
              text = Path("app/client/src/app/app.routes.ts").read_text(encoding="utf-8")
              assert "machineLearningGuard" in text
              assert "path: 'training'" in text
              assert "path: 'training/:view'" in text
              assert text.count("canActivate: [machineLearningGuard]") == 2


          def test_frontend_uses_one_backend_proxy() -> None:
              text = Path("app/client/proxy.conf.cjs").read_text(encoding="utf-8")
              assert "'/api/v1'" in text
              assert "'/health'" in text
              assert "'/api/v1/training'" not in text
              assert "ml-health" not in text
              assert "ml_port" not in text


          def test_capabilities_are_centralized() -> None:
              service = Path("app/client/src/app/services/system.service.ts").read_text(encoding="utf-8")
              shell = Path("app/client/src/app/layout/core-shell.component.ts").read_text(encoding="utf-8")
              assert "fetchApplicationCapabilities" in service
              assert "features.machine_learning" in service
              assert "fetchMlReadiness" not in service
              assert "ML Service" not in shell
          ''')

          write("app/backend/common/tests/test_contracts.py", r'''
          import json
          from pathlib import Path

          import pytest
          from pydantic import ValidationError
          from adsmod_common.capabilities import CapabilitiesResponse
          from adsmod_common.config import AdsmodConfig, load_config

          CONFIG_PATH = Path("app/resources/adsmod.json")


          def test_canonical_config_loads_single_backend_runtime() -> None:
              config = load_config(CONFIG_PATH)
              assert config.version == "3.0.0"
              assert config.runtime.backend_port != config.runtime.frontend_port
              assert not hasattr(config.runtime, "mode")
              assert not hasattr(config.runtime, "ml_port")


          def test_legacy_dual_backend_runtime_keys_are_rejected() -> None:
              payload = json.loads(CONFIG_PATH.read_text(encoding="utf-8"))
              payload["runtime"]["mode"] = "core-ml"
              with pytest.raises(ValidationError):
                  AdsmodConfig.model_validate(payload)


          def test_duplicate_backend_and_frontend_ports_are_rejected() -> None:
              payload = json.loads(CONFIG_PATH.read_text(encoding="utf-8"))
              payload["runtime"]["frontend_port"] = payload["runtime"]["backend_port"]
              with pytest.raises(ValidationError):
                  AdsmodConfig.model_validate(payload)


          def test_capability_contract_is_strict() -> None:
              response = CapabilitiesResponse.model_validate({
                  "version": "3.0.0",
                  "features": {
                      "datasets": True,
                      "nist": True,
                      "fitting": True,
                      "machine_learning": False,
                      "training": False,
                      "checkpoints": False,
                  },
              })
              assert response.features.machine_learning is False
          ''')

          write("app/backend/core/tests/test_core_runtime.py", r'''
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from fastapi.testclient import TestClient
          from adsmod_common.config import StorageConfig, load_config
          from adsmod_core.app import create_app, create_app_from_path

          CONFIG_PATH = Path("app/resources/adsmod.json")


          def _temporary_config(directory: str):
              base = load_config(CONFIG_PATH)
              return base.model_copy(update={
                  "storage": StorageConfig(root=Path(directory)),
                  "application": base.application.model_copy(update={
                      "database": base.application.database.model_copy(update={"sqlite_path": "core.db"})
                  }),
              })


          def test_unified_runtime_contracts(tmp_path: Path) -> None:
              with TemporaryDirectory(dir=tmp_path) as directory:
                  with TestClient(create_app(_temporary_config(directory))) as client:
                      assert client.get("/health/live").json()["service"] == "backend"
                      assert client.get("/health/ready").json()["state"] == "ready"
                      capabilities = client.get("/api/v1/system/capabilities").json()
                      assert capabilities["features"]["datasets"] is True
                      assert capabilities["features"]["machine_learning"] is True
                      assert client.get("/api/v1/system/configuration").status_code == 200
                      assert client.get("/api/v1/training/configuration").status_code == 200


          def test_factory_uses_single_backend_port() -> None:
              application = create_app_from_path(CONFIG_PATH)
              assert application.state.config.runtime.backend_port > 0
              assert not hasattr(application.state.config.runtime, "ml_port")


          def test_in_process_snapshot_access_preserves_hash(tmp_path: Path) -> None:
              with TemporaryDirectory(dir=tmp_path) as directory:
                  with TestClient(create_app(_temporary_config(directory))) as client:
                      access = client.app.state.runtime.training_data
                      rows = [{"id": 1, "value": "alpha"}, {"id": 2, "value": "beta"}]
                      reference = access.create_snapshot(rows)
                      rows[0]["value"] = "mutated-after-create"
                      payload = access.fetch_snapshot(reference.snapshot_id)
                      assert payload.rows[0] == {"id": 1, "value": "alpha"}
                      assert payload.content_hash == reference.content_hash
          ''')

          write("app/backend/ml/tests/test_ml_boundary.py", r'''
          from __future__ import annotations

          import inspect
          from pathlib import Path

          from adsmod_ml.services.container import MlServiceContainer


          def test_ml_container_consumes_in_process_snapshot_access() -> None:
              parameters = inspect.signature(MlServiceContainer).parameters
              assert "snapshot_access" in parameters
              assert "internal_token" not in parameters


          def test_ml_extension_has_no_standalone_fastapi_server_or_core_http_client() -> None:
              root = Path("app/backend/ml/src/adsmod_ml")
              assert not (root / "app.py").exists()
              assert not (root / "cli.py").exists()
              assert not (root / "http" / "entrypoint.py").exists()
              assert not (root / "clients" / "core_client.py").exists()


          def test_ml_source_has_no_backend_to_backend_http_boundary() -> None:
              root = Path("app/backend/ml/src/adsmod_ml")
              combined = "\n".join(path.read_text(encoding="utf-8") for path in root.rglob("*.py"))
              assert "CoreSnapshotClient" not in combined
              assert "core_base_url" not in combined
              assert "X-ADSMOD-Internal-Token" not in combined
          ''')

          write("app/scripts/generate_openapi.py", r'''
          from __future__ import annotations

          import argparse
          import json
          from pathlib import Path

          from adsmod_common.config import load_config
          from adsmod_core.app import create_app


          def main() -> int:
              parser = argparse.ArgumentParser(description="Generate OpenAPI JSON for the unified ADSMOD backend.")
              parser.add_argument("--config", required=True, type=Path, help="Canonical adsmod.json path")
              parser.add_argument("--output", required=True, help="Output JSON path")
              args = parser.parse_args()
              schema = create_app(load_config(args.config)).openapi()
              output_path = Path(args.output)
              output_path.parent.mkdir(parents=True, exist_ok=True)
              output_path.write_text(json.dumps(schema, indent=2) + "\n", encoding="utf-8")
              print(f"OpenAPI written to {output_path}")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          ''')

          write("app/tests/run_tests.bat", r'''
          @echo off
          setlocal EnableDelayedExpansion

          set "SCRIPT_DIR=%~dp0"
          for %%I in ("%SCRIPT_DIR%..\..") do set "PROJECT_ROOT=%%~fI"
          set "APP_DIR=%PROJECT_ROOT%\app"
          set "BACKEND_DIR=%APP_DIR%\backend"
          set "CLIENT_DIR=%APP_DIR%\client"
          set "TESTS_DIR=%APP_DIR%\tests"
          set "RESOURCES_DIR=%APP_DIR%\resources"
          set "CANONICAL_CONFIG=%RESOURCES_DIR%\adsmod.json"
          set "VENV_PYTHON=%BACKEND_DIR%\.venv\Scripts\python.exe"
          set "RUNTIME_NPM=%PROJECT_ROOT%\runtimes\nodejs\npm.cmd"

          for /f "usebackq tokens=*" %%A in (`powershell -NoProfile -Command "(Get-Content -Raw '%CANONICAL_CONFIG%' | ConvertFrom-Json).runtime.host"`) do set "BACKEND_HOST=%%A"& set "UI_HOST=%%A"
          for /f "usebackq tokens=*" %%A in (`powershell -NoProfile -Command "(Get-Content -Raw '%CANONICAL_CONFIG%' | ConvertFrom-Json).runtime.backend_port"`) do set "BACKEND_PORT=%%A"
          for /f "usebackq tokens=*" %%A in (`powershell -NoProfile -Command "(Get-Content -Raw '%CANONICAL_CONFIG%' | ConvertFrom-Json).runtime.frontend_port"`) do set "UI_PORT=%%A"

          set "TEST_BACKEND_HOST=%BACKEND_HOST%"
          set "TEST_UI_HOST=%UI_HOST%"
          if /i "%TEST_BACKEND_HOST%"=="0.0.0.0" set "TEST_BACKEND_HOST=127.0.0.1"
          if /i "%TEST_BACKEND_HOST%"=="::" set "TEST_BACKEND_HOST=127.0.0.1"
          if /i "%TEST_BACKEND_HOST%"=="[::]" set "TEST_BACKEND_HOST=127.0.0.1"
          if /i "%TEST_UI_HOST%"=="0.0.0.0" set "TEST_UI_HOST=127.0.0.1"
          if /i "%TEST_UI_HOST%"=="::" set "TEST_UI_HOST=127.0.0.1"
          if /i "%TEST_UI_HOST%"=="[::]" set "TEST_UI_HOST=127.0.0.1"

          set "APP_TEST_BACKEND_URL=http://%TEST_BACKEND_HOST%:%BACKEND_PORT%"
          set "APP_TEST_FRONTEND_URL=http://%TEST_UI_HOST%:%UI_PORT%"
          if "!STANDARD_TEST_SKIP_LIVE_SERVERS!"=="" set "STANDARD_TEST_SKIP_LIVE_SERVERS=false"
          if "!STANDARD_TEST_SKIP_FRONTEND!"=="" set "STANDARD_TEST_SKIP_FRONTEND=false"
          if "!STANDARD_TEST_INCLUDE_PERFORMANCE!"=="" set "STANDARD_TEST_INCLUDE_PERFORMANCE=false"
          set "TEST_RESULT=0"
          set "STARTED_BACKEND=0"
          set "STARTED_FRONTEND=0"

          if not exist "%VENV_PYTHON%" (
            echo [ERROR] Missing backend venv: "%VENV_PYTHON%"
            exit /b 1
          )
          set "PYTHON_CMD=%VENV_PYTHON%"
          if exist "%RUNTIME_NPM%" (set "NPM_CMD=%RUNTIME_NPM%") else (set "NPM_CMD=npm")
          set "PYTHONPATH=%PROJECT_ROOT%\app\backend\common\src;%PROJECT_ROOT%\app\backend\core\src;%PROJECT_ROOT%\app\backend\ml\src;%PROJECT_ROOT%"
          "%PYTHON_CMD%" -c "import adsmod_common.config; import adsmod_core.app" || exit /b 1

          if /i "!STANDARD_TEST_SKIP_LIVE_SERVERS!"=="false" (
            curl -s --max-time 2 "%APP_TEST_BACKEND_URL%/health/ready" >nul 2>&1
            if errorlevel 1 (
              echo [INFO] Starting unified backend server...
              start "" /B /D "%PROJECT_ROOT%" "%PYTHON_CMD%" -m adsmod_core.cli --config "%CANONICAL_CONFIG%"
              set "STARTED_BACKEND=1"
            )
          )

          echo [STEP] Running Python tests...
          if /i "!STANDARD_TEST_SKIP_LIVE_SERVERS!"=="true" (
            "%PYTHON_CMD%" -m pytest "%TESTS_DIR%" --ignore "%TESTS_DIR%\e2e" -k "not performance" -v --tb=short %*
          ) else (
            "%PYTHON_CMD%" -m pytest "%TESTS_DIR%" -k "not performance" -v --tb=short %*
          )
          if errorlevel 1 set "TEST_RESULT=1"

          if /i "!STANDARD_TEST_SKIP_FRONTEND!"=="false" if exist "%CLIENT_DIR%\package.json" (
            echo [STEP] Running frontend validation...
            call "%NPM_CMD%" --prefix "%CLIENT_DIR%" run test:unit --if-present
            if errorlevel 1 set "TEST_RESULT=1"
            call "%NPM_CMD%" --prefix "%CLIENT_DIR%" run build
            if errorlevel 1 set "TEST_RESULT=1"
          )

          if "%STARTED_BACKEND%"=="1" (
            for /f "tokens=5" %%P in ('netstat -ano ^| findstr /R "LISTENING" ^| findstr /R ":%BACKEND_PORT% "') do taskkill /PID %%P /F >nul 2>&1
          )
          exit /b %TEST_RESULT%
          ''')

          write(".github/workflows/ci.yml", r'''
          name: CI

          on:
            push:
              branches: [main, develop]
            pull_request:
              branches: [main, develop]

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            base-backend:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - uses: astral-sh/setup-uv@v6
                  with:
                    version: "0.11.30"
                    python-version: "3.14.2"
                - name: Install base backend
                  run: uv sync --locked --project app/backend --no-dev
                - name: Validate base capability
                  run: |
                    uv run --project app/backend --no-dev python - <<'PY'
                    import importlib.util, json, tempfile
                    from pathlib import Path
                    from fastapi.testclient import TestClient
                    from adsmod_common.config import AdsmodConfig
                    from adsmod_core.app import create_app
                    assert importlib.util.find_spec('adsmod_ml') is None
                    payload = json.loads(Path('app/resources/adsmod.json').read_text())
                    with tempfile.TemporaryDirectory() as tmp:
                        payload['storage']['root'] = tmp
                        with TestClient(create_app(AdsmodConfig.model_validate(payload))) as client:
                            assert client.get('/api/v1/system/capabilities').json()['features']['machine_learning'] is False
                            assert client.get('/health/ready').json()['state'] == 'ready'
                    PY

            ml-backend:
              runs-on: ubuntu-latest
              timeout-minutes: 45
              steps:
                - uses: actions/checkout@v4
                - uses: astral-sh/setup-uv@v6
                  with:
                    version: "0.11.30"
                    python-version: "3.14.2"
                - name: Install ML-enabled development environment
                  run: uv sync --locked --project app/backend --extra ml --group dev
                - name: Validate backend
                  run: |
                    uv run --project app/backend --extra ml --group dev ruff check --isolated app/backend app/tests app/scripts
                    uv run --project app/backend --extra ml --group dev python -m pytest app/backend/common/tests app/backend/core/tests app/backend/ml/tests app/tests/backend app/tests/persistence app/tests/unit -q --tb=short
                    uv run --project app/backend --extra ml --group dev python app/scripts/generate_openapi.py --config app/resources/adsmod.json --output app/backend/openapi/backend.json
                    uv run --project app/backend --extra ml --group dev python app/scripts/generate_config_schema.py --output app/resources/adsmod.schema.json
                    git diff --exit-code -- app/backend/openapi/backend.json app/resources/adsmod.schema.json

            frontend:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22.13.0'
                    cache: npm
                    cache-dependency-path: app/client/package-lock.json
                - working-directory: app/client
                  run: npm ci --no-audit --no-fund
                - working-directory: app/client
                  run: npm run lint
                - working-directory: app/client
                  run: npm run test:unit --if-present
                - working-directory: app/client
                  run: npm run build
          ''')
      - name: Sync ML-enabled development environment
        run: uv sync --locked --project app/backend --extra ml --group dev
      - name: Generate unified OpenAPI snapshot
        run: uv run --project app/backend --extra ml --group dev python app/scripts/generate_openapi.py --config app/resources/adsmod.json --output app/backend/openapi/backend.json
      - name: Compile Python sources
        run: uv run --project app/backend --extra ml --group dev python -m compileall -q app/backend/common/src app/backend/core/src app/backend/ml/src
      - name: Run backend tests
        run: uv run --project app/backend --extra ml --group dev python -m pytest app/backend/common/tests app/backend/core/tests app/backend/ml/tests app/tests/backend app/tests/persistence app/tests/unit -k "not performance" -q --tb=short
      - name: Run Ruff
        run: uv run --project app/backend --extra ml --group dev ruff check --isolated app/backend app/tests app/scripts
      - name: Install frontend dependencies
        working-directory: app/client
        run: npm ci
      - name: Run frontend unit tests
        working-directory: app/client
        run: npm run test:unit --if-present
      - name: Run frontend lint
        working-directory: app/client
        run: npm run lint --if-present
      - name: Build frontend
        working-directory: app/client
        run: npm run build
      - name: Validate base installation and capability detection
        shell: bash
        run: |
          BASE_ENV="$RUNNER_TEMP/adsmod-base"
          UV_PROJECT_ENVIRONMENT="$BASE_ENV" uv sync --locked --project app/backend --no-dev
          "$BASE_ENV/bin/python" - <<'PY'
          import importlib.util
          import json
          import tempfile
          from pathlib import Path
          from fastapi.testclient import TestClient
          from adsmod_common.config import AdsmodConfig
          from adsmod_core.app import create_app

          assert importlib.util.find_spec('adsmod_ml') is None, 'base installation unexpectedly includes adsmod_ml'
          payload = json.loads(Path('app/resources/adsmod.json').read_text(encoding='utf-8'))
          with tempfile.TemporaryDirectory() as tmp:
              payload['storage']['root'] = tmp
              config = AdsmodConfig.model_validate(payload)
              with TestClient(create_app(config)) as client:
                  capabilities = client.get('/api/v1/system/capabilities').json()
                  assert capabilities['features']['machine_learning'] is False
                  assert client.get('/api/v1/training/configuration').status_code == 404
                  assert client.get('/health/ready').json()['state'] == 'ready'
          PY
      - name: Validate ML-enabled installation and unified routes
        shell: bash
        run: |
          ML_ENV="$RUNNER_TEMP/adsmod-ml"
          UV_PROJECT_ENVIRONMENT="$ML_ENV" uv sync --locked --project app/backend --extra ml --no-dev
          "$ML_ENV/bin/python" - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from fastapi.testclient import TestClient
          from adsmod_common.config import AdsmodConfig
          from adsmod_core.app import create_app

          payload = json.loads(Path('app/resources/adsmod.json').read_text(encoding='utf-8'))
          with tempfile.TemporaryDirectory() as tmp:
              payload['storage']['root'] = tmp
              config = AdsmodConfig.model_validate(payload)
              with TestClient(create_app(config)) as client:
                  capabilities = client.get('/api/v1/system/capabilities').json()
                  assert capabilities['features']['machine_learning'] is True, capabilities
                  assert client.get('/api/v1/training/configuration').status_code == 200
                  assert client.get('/api/v1/datasets').status_code == 200
                  assert client.get('/health/ready').json()['state'] == 'ready'
          PY
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'start_on_windows.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Check obsolete dual-backend references
        shell: bash
        run: |
          set -euo pipefail
          patterns='runtime\.mode|core-ml|core_port|ml_port|ml_restart_attempts|adsmod_ml\.cli|adsmod_ml\.app|CoreSnapshotClient|/ml-health|ADSMOD_INTERNAL_TOKEN|internal_token_required|X-ADSMOD-Internal-Token|core_base_url|openapi/ml\.json'
          if git grep -nE "$patterns" -- ':!app/backend/uv.lock' ':!.github/backend_merge_transform.py' ':!.github/workflows/backend-merge-apply.yml'; then
            echo 'Obsolete dual-backend references remain.' >&2
            exit 1
          fi
          test ! -e app/backend/ml/src/adsmod_ml/app.py
          test ! -e app/backend/ml/src/adsmod_ml/cli.py
          test ! -e app/backend/ml/src/adsmod_ml/http/entrypoint.py
          test ! -e app/backend/ml/src/adsmod_ml/clients/core_client.py
          test ! -e app/backend/openapi/ml.json
          test ! -e app/backend/openapi/core.json
      - name: Review whitespace
        run: git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git rm .github/backend_merge_transform.py .github/workflows/backend-merge-apply.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: unify backend and make ML optional"
          git push origin HEAD:backend-merge
