name: Backend Merge Apply

on:
  push:
    branches:
      - backend-merge

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          python-version: "3.14.2"
      - name: Repair bootstrap schema generation command
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/backend_merge_transform.py')
          text = path.read_text(encoding='utf-8')
          old = 'subprocess.run(["uv", "run", "--project", "app/backend", "--group", "dev", "python", "app/scripts/generate_config_schema.py"], check=True)'
          new = 'subprocess.run(["uv", "run", "--project", "app/backend", "--group", "dev", "python", "app/scripts/generate_config_schema.py", "--output", "app/resources/adsmod.schema.json"], check=True)'
          if old not in text:
              raise SystemExit('expected schema generation command was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply backend merge refactor
        run: python .github/backend_merge_transform.py
      - name: Migrate validation contracts
        run: python .github/backend_merge_validation_migration.py
      - name: Sync ML-enabled development environment
        run: uv sync --locked --project app/backend --extra ml --group dev
      - name: Generate unified OpenAPI snapshot
        run: uv run --project app/backend --extra ml --group dev python app/scripts/generate_openapi.py --config app/resources/adsmod.json --output app/backend/openapi/backend.json
      - name: Compile Python sources
        run: uv run --project app/backend --extra ml --group dev python -m compileall -q app/backend/common/src app/backend/core/src app/backend/ml/src
      - name: Run backend tests
        run: uv run --project app/backend --extra ml --group dev python -m pytest app/backend/common/tests app/backend/core/tests app/backend/ml/tests app/tests/backend app/tests/persistence app/tests/unit -k "not performance" -q --tb=short
      - name: Run Ruff
        run: uv run --project app/backend --extra ml --group dev ruff check --isolated app/backend app/tests app/scripts
      - name: Install frontend dependencies
        working-directory: app/client
        run: npm ci
      - name: Run frontend unit tests
        working-directory: app/client
        run: npm run test:unit --if-present
      - name: Run frontend lint
        working-directory: app/client
        run: npm run lint --if-present
      - name: Build frontend
        working-directory: app/client
        run: npm run build
      - name: Validate base installation
        run: |
          BASE_ENV="$RUNNER_TEMP/adsmod-base"
          UV_PROJECT_ENVIRONMENT="$BASE_ENV" uv sync --locked --project app/backend --no-dev
          "$BASE_ENV/bin/python" - <<'PY'
          import importlib.util
          import json
          import tempfile
          from pathlib import Path
          from fastapi.testclient import TestClient
          from adsmod_common.config import AdsmodConfig
          from adsmod_core.app import create_app
          assert importlib.util.find_spec('adsmod_ml') is None
          payload = json.loads(Path('app/resources/adsmod.json').read_text(encoding='utf-8'))
          with tempfile.TemporaryDirectory() as tmp:
              payload['storage']['root'] = tmp
              with TestClient(create_app(AdsmodConfig.model_validate(payload))) as client:
                  capabilities = client.get('/api/v1/system/capabilities').json()
                  assert capabilities['features']['machine_learning'] is False
                  assert client.get('/api/v1/training/configuration').status_code == 404
                  assert client.get('/health/ready').json()['state'] == 'ready'
          PY
      - name: Validate ML-enabled installation
        run: |
          ML_ENV="$RUNNER_TEMP/adsmod-ml"
          UV_PROJECT_ENVIRONMENT="$ML_ENV" uv sync --locked --project app/backend --extra ml --no-dev
          "$ML_ENV/bin/python" - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from fastapi.testclient import TestClient
          from adsmod_common.config import AdsmodConfig
          from adsmod_core.app import create_app
          payload = json.loads(Path('app/resources/adsmod.json').read_text(encoding='utf-8'))
          with tempfile.TemporaryDirectory() as tmp:
              payload['storage']['root'] = tmp
              with TestClient(create_app(AdsmodConfig.model_validate(payload))) as client:
                  capabilities = client.get('/api/v1/system/capabilities').json()
                  assert capabilities['features']['machine_learning'] is True, capabilities
                  assert client.get('/api/v1/training/configuration').status_code == 200
                  assert client.get('/api/v1/datasets').status_code == 200
                  assert client.get('/health/ready').json()['state'] == 'ready'
          PY
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'start_on_windows.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Check obsolete dual-backend references
        run: |
          set -euo pipefail
          patterns='runtime\.mode|core-ml|core_port|ml_port|ml_restart_attempts|adsmod_ml\.cli|adsmod_ml\.app|CoreSnapshotClient|/ml-health|ADSMOD_INTERNAL_TOKEN|internal_token_required|X-ADSMOD-Internal-Token|core_base_url|openapi/ml\.json'
          if git grep -nE "$patterns" -- ':!app/backend/uv.lock' ':!.github/backend_merge_transform.py' ':!.github/backend_merge_validation_migration.py' ':!.github/workflows/backend-merge-apply.yml'; then
            echo 'Obsolete dual-backend references remain.' >&2
            exit 1
          fi
          test ! -e app/backend/ml/src/adsmod_ml/app.py
          test ! -e app/backend/ml/src/adsmod_ml/cli.py
          test ! -e app/backend/ml/src/adsmod_ml/http/entrypoint.py
          test ! -e app/backend/ml/src/adsmod_ml/clients/core_client.py
          test ! -e app/backend/openapi/ml.json
          test ! -e app/backend/openapi/core.json
      - name: Review whitespace
        run: git diff --check
      - name: Commit implementation
        run: |
          git rm .github/backend_merge_transform.py .github/backend_merge_validation_migration.py .github/workflows/backend-merge-apply.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: unify backend and make ML optional"
          git push origin HEAD:backend-merge
