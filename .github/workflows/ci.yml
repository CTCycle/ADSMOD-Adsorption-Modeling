name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  python-sanity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adsmod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d adsmod_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Python sanity
        run: |
          python --version
          python -c "print('ci sanity ok')"
      - name: Backend import validation
        run: |
          uv sync --project app/server --all-packages --group dev
          PYTHONPATH=app/backend/common/src:app/backend/core/src:app/backend/ml/src uv run --project app/server python -c "import adsmod_common.config; import adsmod_core.app; import adsmod_ml.app; import core_service.app; import ml_service.app; import app.server.app"
          uv run --project app/server ruff check app/server app/backend app/tests
          DATABASE_EMBEDDED=true uv run --project app/server python -m pytest app/tests/persistence -v
          DATABASE_EMBEDDED=false DATABASE_ENGINE=postgres DATABASE_HOST=127.0.0.1 DATABASE_PORT=5432 DATABASE_NAME=adsmod_test DATABASE_USERNAME=postgres DATABASE_PASSWORD=postgres uv run --project app/server python -m pytest app/tests/persistence -v
          uv run --project app/server python -m pytest app/tests/backend --ignore app/tests/backend/performance
          uv run --project app/server python -m pytest app/tests/unit
          uv run --project app/server python -m pytest app/tests/server
          PYTHONPATH=app/backend/common/src:app/backend/core/src:app/backend/ml/src uv run --project app/server python -m pytest app/backend/common/tests app/backend/core/tests app/backend/ml/tests -v
          uv run --project app/server python app/scripts/generate_openapi.py --app core_service.app:app --output app/shared/core_openapi.json
          uv run --project app/server python app/scripts/generate_openapi.py --app ml_service.app:app --output app/shared/ml_openapi.json
          ADSMOD_ENABLE_ML=true uv run --project app/server python -m app.scripts.generate_openapi --app app.server.app:app --output app/shared/openapi.json
          uv run --project app/server python app/scripts/generate_config_schema.py --output app/resources/adsmod.schema.json
          git diff --exit-code -- app/shared/core_openapi.json app/shared/ml_openapi.json app/shared/openapi.json app/resources/adsmod.schema.json

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build core frontend
        run: |
          cd app/client
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npm run lint
          npm run test
          npm run build
