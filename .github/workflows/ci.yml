name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: app/backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - name: Install backend dependencies
        run: |
          uv sync --locked --project app/backend --all-packages --group dev
      - name: Backend import validation
        run: |
          uv run --locked --project app/backend --all-packages python -c "import adsmod_common.config; import adsmod_core.app; import adsmod_ml.app"
          uv run --locked --project app/backend --all-packages ruff check --isolated app/backend app/tests app/scripts
          mkdir -p app/tests/cache
          uv run --locked --project app/backend --all-packages python -m pytest app/backend/common/tests app/backend/core/tests app/backend/ml/tests app/tests/backend app/tests/persistence app/tests/unit -v --basetemp app/tests/cache/pytest-tmp-ci
          uv run --locked --project app/backend --all-packages python app/scripts/generate_openapi.py --service core --config app/resources/adsmod.json --output app/backend/openapi/core.json
          uv run --locked --project app/backend --all-packages python app/scripts/generate_openapi.py --service ml --config app/resources/adsmod.json --output app/backend/openapi/ml.json
          uv run --locked --project app/backend --all-packages python app/scripts/generate_config_schema.py --output app/resources/adsmod.schema.json
          git diff --exit-code -- app/backend/openapi/core.json app/backend/openapi/ml.json app/resources/adsmod.schema.json

  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: app/client/package-lock.json
      - name: Build core frontend
        run: |
          cd app/client
          npm ci --no-audit --no-fund
          npm run lint
          npm run test
          npm run build
